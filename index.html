<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="application-name" content="WordApp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordApp</title>
    <link
      rel="preload"
      href="/src/font/vazirmatn/Vazirmatn-UI-FD-NL-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      const themeStorageKey =
        location.protocol === 'file:' ? 'wordapp-theme' : 'wordapp-theme-dev'
      const storedTheme = localStorage.getItem(themeStorageKey)
      const darkTheme =
        storedTheme === 'dark' ||
        (storedTheme !== 'light' &&
          matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', darkTheme)
    </script>
    <style>
      html {
        background-color: oklch(97.9% 0.021 166.113);
      }
      html.dark {
        background-color: oklch(21% 0.006 285.885);
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        color: black;
        font-family: vazirmatn, 'Inter Variable', sans-serif;
        font-size: 0.875rem;
      }
      html.dark #app-loading {
        color: white;
      }
      #app-loading svg {
        animation: app-loading-spin 1s linear infinite;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loading" role="status">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      در حال بارگذاری...
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
